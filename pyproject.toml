[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gaon-market-tools"
version = "0.1.0"
description = "Offline observational OHLCV and session P/L utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DONGHUN PARK"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[tool.setuptools.packages.find]
where = ["src"]
